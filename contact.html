<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>studio333 — Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="inquire.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a href="gallery.html" class="brand">studio333</a>
        <nav>
          <a href="gallery.html">Gallery</a>
          <a href="featured.html">Featured</a>
          <a href="contact.html" class="active">Contact</a>
          <a href="qr.html">Share</a>
        </nav>
      </header>
      <main>
        <section class="contact-section contact-picker">
          <div class="contact-intro">
            <p class="tagline">Contact</p>
            <h1>Private inquiries</h1>
            <hr style="border: none; border-top: 1px solid #e0dbd5; margin: 0 0 20px;" />
            <p class="contact-subtext">Select one or more works, or send a general note or commission.</p>
            <div class="picker-grid" id="picker-grid"></div>
            <p class="picker-chosen" id="picker-chosen">No works selected — general inquiry</p>
            <!-- Preview routing uses Formsubmit. Production will switch back to Formspree. -->
            <form
              class="contact-form picker-form"
              style="margin-top: 8px;"
              action="https://formsubmit.co/rrandjm43v3r@gmail.com"
              method="POST"
            >
              <div class="contact-field">
                <label class="contact-label" for="picker-name">Name</label>
                <input type="text" id="picker-name" name="name" required />
              </div>
              <div class="contact-field">
                <label class="contact-label" for="picker-email">Email</label>
                <input type="email" id="picker-email" name="email" required />
              </div>
              <div class="contact-field">
                <label class="contact-label" for="picker-phone">Phone</label>
                <input type="tel" id="picker-phone" name="phone" />
              </div>
              <div class="contact-field">
                <label class="contact-label" for="picker-message">Message</label>
                <textarea id="picker-message" name="message"></textarea>
              </div>
              <input type="hidden" name="paintings" id="picker-paintings" />
              <input type="hidden" name="_subject" id="picker-subject" value="studio333 general inquiry" />
              <input type="hidden" name="_captcha" value="false" />
              <input type="hidden" name="_next" value="https://st333inq648e1f75.z5.web.core.windows.net/gallery.html" />
              <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" />
              <button type="submit" class="contact-submit ghost-link">Send inquiry →</button>
            </form>
          </div>
        </section>
      </main>
      <footer class="footer-nav">
        <hr style="border: none; border-top: 1px solid #c8c2ba; margin: 0 0 24px; width: 100%;" />
        <span class="copyright">© 2026 studio333. All rights reserved.</span>
      </footer>
    </div>
    <script src="picker.js" defer></script>
  </body>
</html>
