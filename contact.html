<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>studio333 — Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="inquire.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a href="gallery.html" class="brand">studio333</a>
        <nav>
          <a href="gallery.html">Gallery</a>
          <a href="featured.html">Featured</a>
          <a href="gallery.html#picker">Inquiries</a>
          <a href="contact.html" class="active">Contact</a>
          <a href="qr.html">Share</a>
        </nav>
      </header>
      <main>
        <section class="contact-section">
          <div class="contact-intro">
            <p class="tagline">Contact</p>
            <h1>Get in touch</h1>
            <hr style="border: none; border-top: 1px solid #e0dbd5; margin: 0 0 20px;" />
            <p class="contact-subtext">A note, a commission, or anything else.</p>
            <a
              class="social-ig"
              href="https://www.instagram.com/artbystudio333/"
              target="_blank"
              rel="noopener"
              aria-label="studio333 on Instagram"
            >
              <svg class="social-ig-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor"/>
              </svg>
            </a>
          </div>
          <form
            class="contact-form"
            id="contact-form"
            action="https://st333inqfn29.azurewebsites.net/api/inquire"
            method="POST"
          >
            <div class="contact-field">
              <label class="contact-label" for="contact-name">Name</label>
              <input type="text" id="contact-name" name="name" required />
            </div>
            <div class="contact-field">
              <label class="contact-label" for="contact-email">Email</label>
              <input type="email" id="contact-email" name="email" required />
            </div>
            <div class="contact-field">
              <label class="contact-label" for="contact-phone">Phone</label>
              <input type="tel" id="contact-phone" name="phone" />
            </div>
            <div class="contact-field">
              <label class="contact-label" for="contact-message">Message</label>
              <textarea id="contact-message" name="message" placeholder="How can I help?"></textarea>
            </div>
            <input type="hidden" name="source" value="contact" />
            <input type="hidden" name="_subject" value="studio333 general inquiry" />
            <input type="hidden" name="_captcha" value="false" />
            <input type="hidden" name="_next" value="https://st333inq648e1f75.z5.web.core.windows.net/contact.html" />
            <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" />
            <p class="inquire-status" id="contact-status" hidden></p>
            <button type="submit" class="contact-submit ghost-link">Send</button>
          </form>
        </section>
      </main>
      <footer class="footer-nav">
        <hr style="border: none; border-top: 1px solid #c8c2ba; margin: 0 0 24px; width: 100%;" />
        <span class="copyright">© 2026 studio333. All rights reserved.</span>
      </footer>
    </div>
    <script src="contact.js" defer></script>
  </body>
</html>
